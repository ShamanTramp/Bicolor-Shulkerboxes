name: Verify Minecraft 26.3
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      SDL_VIDEODRIVER: x11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare headless graphics
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Check generated resources
        run: |
          python3 tools/generate_resources.py
          git diff --exit-code -- src/main/resources src/client/resources
      - name: Build, unit tests and server GameTests
        run: ./gradlew build --no-daemon
      - name: Production client, textures, persistence and mixed players
        run: xvfb-run -a -s '-screen 0 1280x720x24 -noreset' ./gradlew runProductionClientGameTest --no-daemon
      - name: Official vanilla client and full server restart
        run: xvfb-run -a -s '-screen 0 1280x720x24 -noreset' python3 tools/vanilla_smoke.py
      - name: Modded client on an actual vanilla server
        run: xvfb-run -a -s '-screen 0 1280x720x24 -noreset' python3 tools/vanilla_server_client.py
      - name: Store the single distributable mod
        uses: actions/upload-artifact@v4
        with:
          name: bicolor-shulkerboxes-minecraft-26.3
          path: build/libs/bicolor-shulkerboxes-*.jar
          if-no-files-found: error
      - name: Store reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
            build/run/**/screenshots/
            build/run/**/logs/
            build/run/**/vanilla-guest.log
            build/vanilla-smoke-26.3/*-server.log
            build/vanilla-smoke-26.3/*-vanilla.log
            build/vanilla-smoke-26.3/report.json
            build/vanilla-server-client-26.3/server.log
